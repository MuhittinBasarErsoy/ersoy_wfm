# Üretim: SQL Server + API + Web, Caddy ile herkese açık HTTPS (Let's Encrypt, otomatik yenilenir).
# Dışarıya yalnızca Caddy'nin 80/443 portları açılır; veritabanı, API ve web Docker ağı içinde kalır.
#   Web : https://${WEB_HOST}
#   API : https://${API_HOST}   (mobil uygulama buraya bağlanır)
# Ayarlar deploy/.env dosyasından gelir (.env.example'a bakın).
name: wfm

services:
  caddy:
    image: caddy:2
    container_name: wfm-caddy
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST:?WEB_HOST gerekli}
      API_HOST: ${API_HOST:?API_HOST gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar; silinirse yeniden alınır (Let's Encrypt sınırlarına dikkat).
      - caddy-data:/data
      - caddy-config:/config

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wfm-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      # 4 GB RAM'li sunucuda API, web ve derlemeye yer kalsın.
      MSSQL_MEMORY_LIMIT_MB: ${DB_MEMORY_MB:-1536}
      TZ: Europe/Istanbul
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { PROJECT: Wfm.Api }
    image: wfm-api
    container_name: wfm-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Wfm: "Server=db;Database=Wfm;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY:?JWT_KEY gerekli}
      Cors__Origins__0: https://${WEB_HOST}
      Seed__DemoData: ${DEMO_DATA:-false}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli}
      TZ: Europe/Istanbul
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { PROJECT: Wfm.Web }
    image: wfm-web
    container_name: wfm-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      # Sunucu tarafı çağrılar Docker ağı içinden; tarayıcıdaki dosya bağlantıları dış adresten.
      Api__BaseUrl: http://api:8080
      Api__PublicUrl: https://${API_HOST}
      DataProtection__KeysPath: /app/keys
      TZ: Europe/Istanbul
    volumes:
      - web-keys:/app/keys

volumes:
  db-data:
  uploads:
  web-keys:
  caddy-data:
  caddy-config:
